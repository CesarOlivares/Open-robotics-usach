; Proyecto PlatformIO del joystick del hexápodo.
;
; Usa el MISMO código que el Arduino IDE (hexapod_joystick/hexapod_joystick.ino)
; y compila micro-ROS (jazzy, transporte serial) para la placa elegida, así
; que sirve para la ESP32 clásica y para la ESP32-S3.
;
;   pio run -e esp32s3                       compilar para ESP32-S3 DevKitC-1
;   pio run -e esp32s3 -t upload             compilar y cargar
;   pio run -e esp32dev                      ESP32 DevKit clásica
;
; La primera compilación tarda varios minutos: descarga y compila micro-ROS.

[platformio]
src_dir = hexapod_joystick

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
build_flags = -DHEXAPOD_PIO

[env:esp32s3]
; ESP32-S3 DevKitC-1: conectar por el puerto USB marcado "UART" (o "COM").
board = esp32-s3-devkitc-1

[env:esp32dev]
board = esp32dev
