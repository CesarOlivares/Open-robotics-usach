# Controladores de ros2_control para el hexápodo (pauta P6).
#
# Lo lee el controller_manager que levanta gz_ros2_control dentro de Gazebo
# (ver hexapod_description/urdf/ros2_control.xacro). El launch los activa
# con el "spawner" de controller_manager.

# Nodo del plugin gz_ros2_control (el "hardware" simulado).
# En modo posición manda a cada junta una velocidad
#     v = −K · (q − q_objetivo) · update_rate
# y el motor de física la limita con el torque y la velocidad del URDF.
# Con la K por defecto (0,1) la junta se atrasa ~0,1 s: a 1 paso por segundo
# eso acorta el paso un 15 % y el robot camina más lento de lo pedido. Un
# servo de hobby tiene un control interno rígido que solo limita su
# velocidad máxima; K = 0,5 (alcanza el objetivo en ~20 ms) se le parece más.
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.1

controller_manager:
  ros__parameters:
    # Lazo de control a 100 Hz: cada 10 ms lee estados, corre los
    # controladores y escribe comandos.
    update_rate: 100

    # Publica /joint_states (posición y velocidad medidas de las 18
    # articulaciones). robot_state_publisher lo usa para la TF.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Las 18 articulaciones. Recibe en /legs_controller/commands un
    # std_msgs/Float64MultiArray con 18 ángulos [rad], en el orden de
    # "joints", y los copia a las interfaces de comando "position".
    # Quien los calcula es gait_node (postura, marcha e IK).
    legs_controller:
      type: position_controllers/JointGroupPositionController

legs_controller:
  ros__parameters:
    joints:
      - lf_coxa_joint
      - lf_femur_joint
      - lf_tibia_joint
      - lm_coxa_joint
      - lm_femur_joint
      - lm_tibia_joint
      - lr_coxa_joint
      - lr_femur_joint
      - lr_tibia_joint
      - rf_coxa_joint
      - rf_femur_joint
      - rf_tibia_joint
      - rm_coxa_joint
      - rm_femur_joint
      - rm_tibia_joint
      - rr_coxa_joint
      - rr_femur_joint
      - rr_tibia_joint
